; The XR arbiter's defaults (see DrsXrPlatform/CLAUDE.md). A project overrides them in its own
; Config/DefaultDrsXrPlatform.ini, which Project Settings > DRS writes; clear an array there with !Name=ClearArray
; before listing its own entries.

; The vendor table the XR arbiter (DrsXrArbiter) uses to choose the vendor XR plugin.
; Keywords are matched, ignoring case, against the device name on Windows, or the brand and manufacturer on Android.
; The first vendor that matches wins.
[/Script/DrsXrArbiter.DrsXrArbiterSettings]
+Vendors=(Id="Meta",Keywords=("Meta","Oculus","Quest"),MarkerModule="OculusXRHMD")
+Vendors=(Id="Pico",Keywords=("Pico"),MarkerModule="PICOOpenXRHMD")

; The desktop OpenXR runtimes the XR arbiter can select on Windows, and the order it prefers them in. A running runtime
; wins over one that is only installed. SteamVR comes first, so launching SteamVR before the app selects it for any
; headset; Meta's Link software runs from boot, so it always counts as running.
[/Script/DrsXrArbiter.DrsXrRuntimeSettings]
+Runtimes=(Name="SteamVR",Manifest=((Locator=UriHandler,Name="steamvr",Path="../../steamxr_win64.json"),(Locator=SteamLibrary,Path="steamapps/common/SteamVR/steamxr_win64.json")),RunningProcesses=("vrmonitor.exe"))
+Runtimes=(Name="Oculus",Vendor="Meta",Manifest=((Locator=EnvironmentVariable,Name="OculusBase",Path="Support/oculus-runtime/oculus_openxr_64.json"),(Locator=RegisteredRuntime,Path="oculus_openxr_64.json")),RunningProcesses=("oculus-platform-runtime.exe"))
+Runtimes=(Name="PicoStreaming",Vendor="Pico",Manifest=((Locator=ProgramFiles,Path="Business Streaming/openvr_driver/resources/ps_xrt/picostreaming-openxr.json")),RunningProcesses=("Business Streaming.exe"))
+Runtimes=(Name="PicoConnect",Vendor="Pico",Manifest=((Locator=ProgramFiles,Path="PICO Connect/openvr_driver/resources/ps_xrt/picostreaming-openxr.json")),RunningProcesses=("PICO Connect.exe"))
+RuntimePriority=SteamVR
+RuntimePriority=Oculus
+RuntimePriority=PicoStreaming
+RuntimePriority=PicoConnect
