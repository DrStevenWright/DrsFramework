; Rules the DrsXrArbiter plugin arbiter uses to choose the vendor XR plugin type (see DrsXrPlatform/CLAUDE.md).
; The first rule that matches wins. Projects can add rules in their own DefaultGame.ini.
[/Script/DrsXrArbiter.DrsXrArbiterSettings]
; Standalone (Android): by device properties. The Quest 1 GPU (Adreno 540) is excluded.
+MobileDeviceArbitrationRules=(Configuration=Meta,Conditions=((ConditionType=RequiredTrue,Criteria=DeviceMake,Value="Meta")))
+MobileDeviceArbitrationRules=(Configuration=Meta,Conditions=((ConditionType=RequiredTrue,Criteria=DeviceMake,Value="Oculus"),(ConditionType=RequiredFalse,Criteria=GpuFamily,Value="Adreno (TM) 540")))
+MobileDeviceArbitrationRules=(Configuration=Pico,Conditions=((ConditionType=RequiredTrue,Criteria=DeviceMake,Value="Pico")))
; Tethered (Windows): by the selected OpenXR runtime, then by the HMD device name.
+TetheredDeviceArbitrationRules=(Configuration=Meta,Conditions=((ConditionType=RequiredTrue,Criteria=XrRuntime,Value="Oculus")))
+TetheredDeviceArbitrationRules=(Configuration=Meta,Conditions=((ConditionType=OptionalTrue,Criteria=DeviceName,Value="Meta"),(ConditionType=OptionalTrue,Criteria=DeviceName,Value="Quest2")))
+TetheredDeviceArbitrationRules=(Configuration=Pico,Conditions=((ConditionType=RequiredTrue,Criteria=XrRuntime,Value="Pico")))
+TetheredDeviceArbitrationRules=(Configuration=Pico,Conditions=((ConditionType=RequiredTrue,Criteria=DeviceName,Value="Pico")))
