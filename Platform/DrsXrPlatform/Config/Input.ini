[/Script/OpenXRHandTracking.OpenXRHandTrackingSettings]
; Prefix the hand-tracking motion sources with 'HandTracking' (e.g. 'HandTrackingLeftWrist'), so that they cannot clash
; with the OpenXR controller sources of the same name (e.g. 'LeftPalm'). UDrsXrPlatformLibrary::GetMotionControllerSource
; follows this setting.
bUseMoreSpecificMotionSourceNames=True
; Don't map the legacy 'Left'/'Right' sources to the hand-tracking palm; they are the OpenXR controller grip sources.
bSupportLegacyControllerMotionSources=False
